<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="A film slate snaps shut: that&apos;s a wrap. Thanks for your attention. I know it’s a limited resource.">
<style>
.fob{animation:fob .8s ease-out both}
.raise{animation:raise .7s cubic-bezier(0.16, 1, 0.3, 1) .15s both}
.clap{transform-origin:102px 90px;animation:clap 1.3s linear .25s both}
.impact{transform-box:fill-box;transform-origin:left bottom;animation:impact .5s ease-out 1.02s}
.cut{animation:fade .3s ease-out 1.05s both}
.ca{animation:ca 1s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both}
.cb{animation:cb 1s cubic-bezier(0.16, 1, 0.3, 1) 1.1s both}
.main{animation:fade .5s ease-out 1.5s both}
.type{transform-box:fill-box;transform-origin:left center;animation:type 0.93s steps(31) 1.9s both}
@keyframes fade{from{opacity:0}}
@keyframes fob{from{opacity:1}}
@keyframes raise{from{opacity:0;transform:translateY(60px) rotate(4deg)}}
@keyframes clap{0%{transform:rotate(-30deg)}50%{transform:rotate(-30deg);animation-timing-function:cubic-bezier(0.55, 0, 1, 0.45)}64%{transform:rotate(0)}74%{transform:rotate(-4deg)}84%{transform:rotate(0)}}
@keyframes impact{0%{opacity:1;transform:scale(.4)}}
@keyframes ca{from{transform:translateX(-34px);opacity:0}}
@keyframes cb{from{transform:translateX(34px);opacity:0}}
@keyframes type{from{transform:scaleX(0)}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
