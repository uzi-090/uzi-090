
name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate purple snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: uzi-090
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=purple

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
