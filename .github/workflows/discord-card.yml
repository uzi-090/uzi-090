name: Update animated Discord card

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *' # every two hours, UTC (not truly live)

permissions:
  contents: write

concurrency:
  group: discord-gif-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIF renderer
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Create animated Discord GIF
        env:
          DISCORD_USER_ID: '737953430051618839'
        run: |
          python scripts/render_card.py --fps 20 --seconds 5 --width 480 --theme tokyoNight
      - name: Commit updated GIF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/discord-card.gif
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update animated Discord card'
            git push
          else
            echo 'Discord card has not changed.'
          fi
